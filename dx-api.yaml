      parameters:
        - name: agentID
          in: path
          description: Agent Rule ID
          required: true
          schema:
            type: string
        - name: contextID
          in: query
          description: Context ID
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          description: list of results that should be there inside a page
          required: false
          schema:
            type: string
        - name: pageIndex
          in: query
          description: Index of page that need to be retrived
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: Accept
          headers:
            cache-control:
              description: Client cache control mechanism - disable it
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorClassification:
                    type: string
                  localizedValue:
                    type: string
              example:
                errorClassification: string
                localizedValue: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorClassification:
                    type: string
                  localizedValue:
                    type: string
              example:
                errorClassification: string
                localizedValue: string
    post:
      tags:
        - AgentX
      summary: Initiate AI conversation
      operationId: post_ai_agents_agentID_conversations
      description: Publishes the YAML, initiates a conversation for the given agent rule in the given context and returns
        conversation ID along with other fields. interactionID is part of request payload when a conversation is initiated
        from non pega application.
      parameters:
        - name: agentID
          in: path
          description: Agent Rule ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contextID:
                  type: string
                interactionID:
                  type: string
                activeChannel:
                  type: string
                activeChannelID:
                  type: string
                executeStarterQuestion:
                  type: boolean
            example:
              contextID: string
              interactionID: string
              activeChannel: string
              activeChannelID: string
              executeStarterQuestion: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: string
              example: Accept
          headers:
            cache-control:
              description: Client cache control mechanism - disable it
              schema:
                type: string
        '400':
          description: Invalid Inputs
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorClassification:
                    type: string
                  localizedValue:
                    type: string
              example:
                errorClassification: string
                localizedValue: string
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorClassification:
                    type: string
                  localizedValue:
                    type: string
              example:
                errorClassification: string
                localizedValue: string
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorClassification:
                    type: string
                  localizedValue:
                    type: string
              example:
                errorClassification: string
                localizedValue: string
