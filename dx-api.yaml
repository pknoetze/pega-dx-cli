          description: Agent Rule ID
          required: true
          schema:
            type: string
        - name: conversationID
          in: path
          description: Conversation ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Request:
                  type: string
                Attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      attachmentFieldName:
                        type: string
                      ID:
                        type: string
                      category:
                        type: string
                      delete:
                        type: boolean
                      name:
                        type: string
                      type:
                        type: string
                      pyRouteToWorkbasket:
                        type: string
                activeChannel:
                  type: string
                activeChannelID:
                  type: string
                capabilities:
                  type: object
                  properties: {}
            example:
              Request: string
              Attachments:
                - attachmentFieldName: string
                  ID: string
                  category: string
                  delete: true
                  name: string
                  type: string
                  pyRouteToWorkbasket: string
              activeChannel: string
              activeChannelID: string
              capabilities: {}
