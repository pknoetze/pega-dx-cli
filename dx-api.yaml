openapi: 3.0.3
info:
  title: Pega DX API
  description: Pega Digital Experience (DX) API specification. This document was reconstructed from the Pega DX API Swagger
    UI export. It exposes endpoints to manage cases, assignments, attachments, data views, AI agents, social interactions,
    and other Pega DX capabilities.
  version: 25.1.2
  contact:
    name: Pega DX API
    url: https://docs.pega.com/
servers:
  - url: https://{tenant}.pegademo.com/prweb/api/application/v2
    description: Pega DX API base URL. Replace {tenant} with your Pega Demo instance.
    variables:
      tenant:
        default: your-tenant
        description: Your Pega tenant identifier
tags:
  - name: Agent2Agent (A2A)
    description: Endpoints for managing agent-to-agent (A2A) conversations with AI agents.
  - name: AgentX
    description: AgentX endpoints for AI agent and conversation management.
  - name: Assignment
    description: Endpoints for fetching and acting on assignments.
  - name: GenAI Assistant
    description: GenAI assistant conversation management endpoints.
  - name: Attachment
    description: Attachment upload, fetch, edit, and delete operations.
  - name: Authentication Profile
    description: Authentication profile and user token management.
  - name: Case
    description: 'Case lifecycle management: create, view, update, transition, delete.'
  - name: Document
    description: Document content retrieval and case-document association.
  - name: Follower
    description: Manage case followers.
  - name: Participants
    description: Manage case participants and roles.
  - name: Related case
    description: Manage related cases.
  - name: Tag
    description: Manage case tags.
  - name: Case type
    description: Case type and bulk action metadata.
  - name: Page
    description: Page, dashboard, portal, and insight details.
  - name: Static Content
    description: Static file, component, and profile image retrieval.
  - name: Data
    description: Data object, data page, and data view operations (CRUD).
  - name: Social
    description: 'Social collaboration: feeds, messages, mentions, tags, likes.'
  - name: Recents
    description: Recently accessed items.
  - name: B2S Authentication Token
    description: Backend-to-Service authentication token refresh.
  - name: List
    description: List/grid item movement operations.
  - name: Personalizations
    description: Save, update, retrieve, and remove personalizations on list components.
  - name: User Settings
    description: Get and set user settings.
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{tenant}.pega.com/prweb/PRRestService/oauth2/v1/token
          scopes: {}
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        errorClassification:
          type: string
        localizedValue:
          type: string
        errorDetails:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              erroneousInputOutputFieldInPage:
                type: string
              erroneousInputOutputIdentifier:
                type: string
              localizedValue:
                type: string
security:
  - OAuth2: []
  - BearerAuth: []
paths:
  /ai-agents:
    get:
      tags:
        - Agent2Agent (A2A)
      summary: Fetch all agents
      operationId: get_ai_agents
      description: Fetch all agents enabled for external access
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
              example: Accept
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorClassification:
                    type: string
                  localizedValue:
                    type: string
              example:
                errorClassification: string
                localizedValue: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorClassification:
                    type: string
                  localizedValue:
                    type: string
              example:
                errorClassification: string
                localizedValue: string
  /ai-agents/{agentID}/conversations:
    get:
      tags:
        - AgentX
      summary: Get conversations
      operationId: get_ai_agents_agentID_conversations
