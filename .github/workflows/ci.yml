name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: NODE_OPTIONS=--experimental-vm-modules npm test
      - run: npm run audit:endpoints
      - run: npm run check:examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-doc
          path: reference/api-coverage.md
